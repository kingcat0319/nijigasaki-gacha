<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>니지가사키 누이 가챠 시뮬레이터</title>
  <!-- Tailwind CSS 및 React, Babel 라이브러리 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MEMBERS = [
      { name: '아사카 카린', color: '#485EC6', text: 'text-white' },
      { name: '우에하라 아유무', color: '#EE7D9F', text: 'text-white' },
      { name: '미야시타 아이', color: '#FF6E20', text: 'text-white' },
      { name: '오사카 시즈쿠', color: '#01B7ED', text: 'text-white' },
      { name: '유키 세츠나', color: '#D81C2F', text: 'text-white' },
      { name: '나카스 카스미', color: '#E7D600', text: 'text-gray-900' },
      { name: '미후네 시오리코', color: '#39B184', text: 'text-white' },
      { name: '코노에 카나타', color: '#A664A0', text: 'text-white' },
      { name: '미아 테일러', color: '#E9E7EB', text: 'text-gray-900' },
      { name: '엠마 베르데', color: '#84C36E', text: 'text-white' },
      { name: '쇼우 란쥬', color: '#F69992', text: 'text-white' },
      { name: '텐노지 리나', color: '#9CA5B9', text: 'text-white' },
      { name: '타카사키 유우', color: '#2BA28B', text: 'text-white' }
    ];

    function App() {
      const [spentJpy, setSpentJpy] = useState(0);
      const [pullsCount, setPullsCount] = useState(0);
      const [exchangeRate, setExchangeRate] = useState(870); // 기본 환율 100엔당 870원
      const [inventory, setInventory] = useState(() => {
        const initial = { A: 0, B: 0, C: 0, D: 0 };
        MEMBERS.forEach(m => initial[m.name] = 0);
        return initial;
      });
      const [currentRoll, setCurrentRoll] = useState([]);

      const handlePull = () => {
        const newInv = { ...inventory };
        const rollResults = [];

        for (let i = 0; i < 10; i++) {
          const rand = Math.random() * 100;
          if (rand < 23.4) {
            // 누이 당첨 (23.4% = 멤버당 1.8%)
            const picked = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
            newInv[picked.name] = (newInv[picked.name] || 0) + 1;
            rollResults.push({ type: 'Nui', member: picked });
          } else if (rand < 33.4) {
            // A상 (10%)
            newInv.A++;
            rollResults.push({ type: 'A상' });
          } else if (rand < 50.0) {
            // B상 (16.6%)
            newInv.B++;
            rollResults.push({ type: 'B상' });
          } else if (rand < 70.0) {
            // C상 (20%)
            newInv.C++;
            rollResults.push({ type: 'C상' });
          } else {
            // D상 (30%)
            newInv.D++;
            rollResults.push({ type: 'D상' });
          }
        }

        setSpentJpy(prev => prev + 8000);
        setPullsCount(prev => prev + 10);
        setInventory(newInv);
        setCurrentRoll(rollResults);
      };

      const handleReset = () => {
        setSpentJpy(0);
        setPullsCount(0);
        setCurrentRoll([]);
        const initial = { A: 0, B: 0, C: 0, D: 0 };
        MEMBERS.forEach(m => initial[m.name] = 0);
        setInventory(initial);
      };

      const spentKrw = Math.floor((spentJpy / 100) * (exchangeRate || 0));

      return (
        <div className="max-w-4xl mx-auto space-y-6 pb-12">
          {/* 헤더 */}
          <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
            <h1 className="text-2xl font-bold text-slate-800">니지가사키 누이 가챠 시뮬레이터</h1>
            <p className="text-sm text-slate-500 mt-1">10연차 8,000엔 / 누이 확률 23.4% (멤버별 1.8%)</p>
          </header>

          {/* 대시보드 & 환율 설정 */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <span className="text-xs text-slate-400 font-medium">총 소모 엔화</span>
              <div className="text-2xl font-black text-slate-800 mt-1">{spentJpy.toLocaleString()} 엔</div>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <span className="text-xs text-slate-400 font-medium">총 소모 원화 (약)</span>
              <div className="text-2xl font-black text-rose-600 mt-1">{spentKrw.toLocaleString()} 원</div>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <label className="text-xs text-slate-400 font-medium block">100엔당 환율 (원)</label>
              <input
                type="number"
                value={exchangeRate}
                onChange={e => setExchangeRate(Number(e.target.value))}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-1.5 text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>

          {/* 조작 버튼 */}
          <div className="flex gap-3">
            <button
              onClick={handlePull}
              className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95 text-lg"
            >
              10연 뽑기 (8,000엔)
            </button>
            <button
              onClick={handleReset}
              className="px-6 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition active:scale-95"
            >
              초기화
            </button>
          </div>

          {/* 결과 및 현황 Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* 최근 뽑기 결과 */}
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <h2 className="text-lg font-bold text-slate-800 mb-4 flex justify-between items-center">
                <span>최근 10연차 결과</span>
                <span className="text-xs font-normal text-slate-400">총 {pullsCount}회 실행</span>
              </h2>
              {currentRoll.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-sm">
                  위 버튼을 눌러 가챠를 진행하세요!
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-2 gap-2">
                  {currentRoll.map((item, idx) => (
                    <div
                      key={idx}
                      className="p-3 rounded-lg text-center font-bold text-sm shadow-sm flex flex-col justify-center items-center min-h-[64px]"
                      style={{
                        backgroundColor: item.type === 'Nui' ? item.member.color : '#F1F5F9',
                        color: item.type === 'Nui' ? (item.member.text === 'text-gray-900' ? '#111827' : '#FFFFFF') : '#334155'
                      }}
                    >
                      {item.type === 'Nui' ? (
                        <>
                          <span className="text-[10px] opacity-80 uppercase tracking-wider">[누이구루미]</span>
                          <span>{item.member.name}</span>
                        </>
                      ) : (
                        <span>{item.type}</span>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* 인벤토리 (보유 현황) */}
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-6">
              <div>
                <h2 className="text-lg font-bold text-slate-800 mb-3">누이구루미 수집 현황</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                  {MEMBERS.map(m => (
                    <div
                      key={m.name}
                      className="flex justify-between items-center p-2.5 rounded-lg border border-slate-100"
                      style={{ backgroundColor: `${m.color}15` }}
                    >
                      <div className="flex items-center gap-2">
                        <span
                          className="w-3 h-3 rounded-full shrink-0"
                          style={{ backgroundColor: m.color }}
                        />
                        <span className="text-sm font-semibold text-slate-700">{m.name}</span>
                      </div>
                      <span className="text-sm font-bold text-slate-900 bg-white px-2 py-0.5 rounded shadow-sm">
                        {inventory[m.name]}개
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h3 className="text-sm font-bold text-slate-600 mb-2">기타 굿즈 현황</h3>
                <div className="grid grid-cols-4 gap-2 text-center">
                  {['A', 'B', 'C', 'D'].map(tier => (
                    <div key={tier} className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                      <div className="text-xs text-slate-400 font-bold">{tier}상</div>
                      <div className="text-base font-black text-slate-700">{inventory[tier]}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>니지가사키 제일복권 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MEMBERS = [
      { name: '아사카 카린', color: '#485EC6', text: 'text-white' },
      { name: '우에하라 아유무', color: '#EE7D9F', text: 'text-white' },
      { name: '미야시타 아이', color: '#FF6E20', text: 'text-white' },
      { name: '오사카 시즈쿠', color: '#01B7ED', text: 'text-white' },
      { name: '유키 세츠나', color: '#D81C2F', text: 'text-white' },
      { name: '나카스 카스미', color: '#E7D600', text: 'text-gray-900' },
      { name: '미후네 시오리코', color: '#39B184', text: 'text-white' },
      { name: '코노에 카나타', color: '#A664A0', text: 'text-white' },
      { name: '미아 테일러', color: '#E9E7EB', text: 'text-gray-900' },
      { name: '엠마 베르데', color: '#84C36E', text: 'text-white' },
      { name: '쇼우 란쥬', color: '#F69992', text: 'text-white' },
      { name: '텐노지 리나', color: '#9CA5B9', text: 'text-white' },
      { name: '타카사키 유우', color: '#2BA28B', text: 'text-white' }
    ];

    function App() {
      const [spentJpy, setSpentJpy] = useState(0);
      const [pullsCount, setPullsCount] = useState(0);
      const [exchangeRate, setExchangeRate] = useState(870);
      const [currentRoll, setCurrentRoll] = useState([]);
      
      const [inventory, setInventory] = useState(() => {
        const initial = { A: 0, B: 0, C1: 0, C2: 0, D: {}, E: {}, F: {}, G: {} };
        MEMBERS.forEach(m => {
          initial.D[m.name] = 0;
          initial.E[m.name] = 0;
          initial.F[m.name] = 0;
          initial.G[m.name] = 0;
        });
        return initial;
      });

      const handlePull = () => {
        const newInv = { ...inventory };
        const rollResults = [];

        for (let i = 0; i < 10; i++) {
          const rand = Math.random() * 100;
          
          if (rand < 3) {
            // A상 (3%)
            newInv.A++;
            rollResults.push({ type: 'A상', name: 'A상', color: '#FFD700', text: 'text-black' });
          } else if (rand < 5) {
            // B상 (2%) - 누적 5%
            newInv.B++;
            rollResults.push({ type: 'B상', name: 'B상', color: '#C0C0C0', text: 'text-black' });
          } else if (rand < 9) {
            // C상 (2종류 2%씩, 총 4%) - 누적 9%
            const cType = Math.random() < 0.5 ? 1 : 2;
            newInv[`C${cType}`]++;
            rollResults.push({ type: 'C상', name: `C상 (${cType})`, color: '#CD7F32', text: 'text-white' });
          } else if (rand < 22) {
            // D상(누이) (13명 1%씩, 총 13%) - 누적 22%
            const member = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
            newInv.D[member.name]++;
            rollResults.push({ type: 'D상(누이)', name: member.name, color: member.color, text: member.text });
          } else if (rand < 42.8) {
            // E상 (13명 1.6%씩, 총 20.8%) - 누적 42.8%
            const member = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
            newInv.E[member.name]++;
            rollResults.push({ type: 'E상', name: member.name, color: member.color, text: member.text });
          } else if (rand < 66.2) {
            // F상 (13명 1.8%씩, 총 23.4%) - 누적 66.2%
            const member = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
            newInv.F[member.name]++;
            rollResults.push({ type: 'F상', name: member.name, color: member.color, text: member.text });
          } else {
            // G상 (13명 2.6%씩, 총 33.8%) - 누적 100%
            const member = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
            newInv.G[member.name]++;
            rollResults.push({ type: 'G상', name: member.name, color: member.color, text: member.text });
          }
        }

        setSpentJpy(prev => prev + 8000);
        setPullsCount(prev => prev + 10);
        setInventory(newInv);
        setCurrentRoll(rollResults);
      };

      const handleReset = () => {
        setSpentJpy(0);
        setPullsCount(0);
        setCurrentRoll([]);
        const initial = { A: 0, B: 0, C1: 0, C2: 0, D: {}, E: {}, F: {}, G: {} };
        MEMBERS.forEach(m => {
          initial.D[m.name] = 0;
          initial.E[m.name] = 0;
          initial.F[m.name] = 0;
          initial.G[m.name] = 0;
        });
        setInventory(initial);
      };

      const spentKrw = Math.floor((spentJpy / 100) * (exchangeRate || 0));

      return (
        <div className="max-w-6xl mx-auto space-y-6 pb-12">
          <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
            <h1 className="text-2xl font-bold text-slate-800">니지가사키 제일복권 가챠 시뮬레이터</h1>
            <p className="text-sm text-slate-500 mt-1">10연차 8,000엔 / A상 3%, B상 2%, C상 4%, D상(누이) 13%, E상 20.8%, F상 23.4%, G상 33.8%</p>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <span className="text-xs text-slate-400 font-medium">총 소모 엔화</span>
              <div className="text-2xl font-black text-slate-800 mt-1">{spentJpy.toLocaleString()} 엔</div>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <span className="text-xs text-slate-400 font-medium">총 소모 원화 (약)</span>
              <div className="text-2xl font-black text-rose-600 mt-1">{spentKrw.toLocaleString()} 원</div>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <label className="text-xs text-slate-400 font-medium block">100엔당 환율 (원)</label>
              <input
                type="number"
                value={exchangeRate}
                onChange={e => setExchangeRate(Number(e.target.value))}
                className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-1.5 text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>

          <div className="flex gap-3">
            <button
              onClick={handlePull}
              className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95 text-lg"
            >
              10연 뽑기 (8,000엔)
            </button>
            <button
              onClick={handleReset}
              className="px-6 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition active:scale-95"
            >
              초기화
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
              <h2 className="text-lg font-bold text-slate-800 mb-4 flex justify-between items-center">
                <span>최근 10연차 결과</span>
                <span className="text-xs font-normal text-slate-400">총 {pullsCount}회 실행</span>
              </h2>
              {currentRoll.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-sm">
                  위 버튼을 눌러 가챠를 진행하세요!
                </div>
              ) : (
                <div className="grid grid-cols-2 gap-2">
                  {currentRoll.map((item, idx) => (
                    <div
                      key={idx}
                      className={`p-3 rounded-lg text-center font-bold text-sm shadow-sm flex flex-col justify-center items-center min-h-[64px] ${item.text}`}
                      style={{ backgroundColor: item.color }}
                    >
                      <span className="text-[10px] opacity-90 uppercase tracking-wider">[{item.type}]</span>
                      <span>{item.name}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="lg:col-span-8 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-6">
              <div>
                <h3 className="text-sm font-bold text-slate-600 mb-2">상위상 획득 현황</h3>
                <div className="grid grid-cols-4 gap-2 text-center">
                  <div className="bg-yellow-50 p-2 rounded-lg border border-yellow-200 text-yellow-800">
                    <div className="text-xs font-bold">A상 (3%)</div>
                    <div className="text-base font-black">{inventory.A}</div>
                  </div>
                  <div className="bg-gray-50 p-2 rounded-lg border border-gray-300 text-gray-700">
                    <div className="text-xs font-bold">B상 (2%)</div>
                    <div className="text-base font-black">{inventory.B}</div>
                  </div>
                  <div className="bg-orange-50 p-2 rounded-lg border border-orange-200 text-orange-800">
                    <div className="text-xs font-bold">C상-1 (2%)</div>
                    <div className="text-base font-black">{inventory.C1}</div>
                  </div>
                  <div className="bg-orange-50 p-2 rounded-lg border border-orange-200 text-orange-800">
                    <div className="text-xs font-bold">C상-2 (2%)</div>
                    <div className="text-base font-black">{inventory.C2}</div>
                  </div>
                </div>
              </div>

              <div>
                <h2 className="text-lg font-bold text-slate-800 mb-3">멤버별 하위상 수집 현황</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-center border-collapse">
                    <thead>
                      <tr className="bg-slate-50 text-slate-600 border-b-2 border-slate-200">
                        <th className="p-2 text-left w-1/5">멤버 이름</th>
                        <th className="p-2 w-1/5">D상(누이) 1%</th>
                        <th className="p-2 w-1/5">E상 1.6%</th>
                        <th className="p-2 w-1/5">F상 1.8%</th>
                        <th className="p-2 w-1/5">G상 2.6%</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {MEMBERS.map(m => (
                        <tr key={m.name} className="hover:bg-slate-50">
                          <td className="p-2 text-left font-semibold flex items-center gap-2">
                            <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: m.color }}></span>
                            {m.name}
                          </td>
                          <td className={`p-2 ${inventory.D[m.name] > 0 ? 'font-bold text-blue-600' : 'text-slate-300'}`}>{inventory.D[m.name]}</td>
                          <td className={`p-2 ${inventory.E[m.name] > 0 ? 'font-bold text-slate-800' : 'text-slate-300'}`}>{inventory.E[m.name]}</td>
                          <td className={`p-2 ${inventory.F[m.name] > 0 ? 'font-bold text-slate-800' : 'text-slate-300'}`}>{inventory.F[m.name]}</td>
                          <td className={`p-2 ${inventory.G[m.name] > 0 ? 'font-bold text-slate-800' : 'text-slate-300'}`}>{inventory.G[m.name]}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
